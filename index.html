<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Сапёр</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">💣</div>
            <h1>Сапёр</h1>
            <p class="subtitle">Найди все мины!</p>
        </div>

        <div class="stats">
            <div class="stat">
                <span class="stat-label">💣 Мины</span>
                <span class="stat-value" id="minesCount">10</span>
            </div>
            <div class="stat">
                <span class="stat-label">⏱️ Время</span>
                <span class="stat-value" id="timer">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">🚩 Флаги</span>
                <span class="stat-value" id="flagsCount">0</span>
            </div>
        </div>

        <div class="board" id="board"></div>

        <button id="restartBtn" class="btn-primary">
            🔄 Новая игра
        </button>

        <div class="footer">
            <p>Нажми на клетку — открой. Долгое нажатие — поставить флаг 🚩</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
