<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Угадай число</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">🎯</div>
            <h1>Угадай число</h1>
            <p class="subtitle">Я загадал число от 1 до 100</p>
        </div>

        <div class="game-area">
            <div class="attempts">
                <span>Попыток: <b id="attempts">0</b></span>
            </div>

            <div class="hint" id="hint">
                Введи число и нажми "Проверить"
            </div>

            <input 
                type="number" 
                id="guessInput" 
                placeholder="Твоё число..." 
                min="1" 
                max="100"
                autocomplete="off"
            >

            <button id="checkBtn" class="btn-primary">
                Проверить
            </button>

            <button id="restartBtn" class="btn-secondary" style="display:none;">
                Играть снова
            </button>
        </div>

        <div class="footer">
            <p>Число от 1 до 100</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
